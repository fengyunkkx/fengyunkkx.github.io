---
layout: page
title: Tags
---
<div class="section-head"><span>02 / TOPICS</span><span>{{ site.tags | size }} CLUSTERS</span></div>
<section class="tag-cloud">{% for tag in site.tags %}<a class="tag-chip" id="{{ tag[0] | slugify }}" href="#{{ tag[0] | slugify }}"><span>{{ tag[0] }}</span><small>{{ tag[1].size | prepend: '0' | slice: -2, 2 }}</small></a>{% endfor %}</section>
<style>.tag-cloud{display:flex;flex-wrap:wrap;gap:10px;padding:30px 0 80px}.tag-chip{display:flex;align-items:center;gap:22px;border:1px solid var(--line);padding:15px 17px;color:var(--ink);text-decoration:none;font-size:17px}.tag-chip:hover{background:var(--acid);border-color:var(--acid)}.tag-chip small{font:11px var(--mono);color:var(--muted)}</style>
